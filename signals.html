<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Signals | Campus Traffic Management</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"> Campus Traffic Management Portal</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/signals" class="active">Signals</a></li>
            <li><a href="/congestion">Congestion</a></li>
            <li><a href="/simulate">Simulate</a></li>
            <li><a href="/report">Report</a></li>
            <li><a href="/upload">Upload Video</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <h1 class="page-title">🚗 Manage Traffic Signals</h1>
        <form class="form" method="POST">
            <input type="text" name="location" placeholder="Signal Location" required>
            <select name="status" required>
                <option value="Green">Green</option>
                <option value="Yellow">Yellow</option>
                <option value="Red">Red</option>
            </select>
            <button type="submit">Add Signal</button>
        </form>

        <div class="list-container">
            {% for signal in signals %}
                <div class="list-item">
                    <span><strong>{{ signal.location }}</strong> - <span class="tag {{ signal.status|lower }}">{{ signal.status }}</span></span>
                    <a class="delete-btn" href="/delete_signal/{{ signal.id }}">Delete</a>
                </div>
            {% endfor %}
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Traffic Management System. All rights reserved.</p>
    </footer>
</body>
</html>
